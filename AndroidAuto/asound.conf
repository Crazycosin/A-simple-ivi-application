# 板子有两张声卡：card 0 "x9-mach" 是 snd-soc-dummy-dai 占位链路（无真实硬件），
# card 1 "x9tlv320aic23" 才是真正的 TLV320AIC23 codec。
# 没有本文件时 ALSA 的 "default" PCM 解析到 card 0，写数据没人消费，写操作永久阻塞。
# 这里把 default 显式钉到 card 1。用的是裸 "hw" 类型而不是 "plug"：这台板子的
# alsa-lib 安装里 plug 的自动采样率/格式协商链路本身是坏的（见 TEST.md 第 9 节排查
# 过程），套 plug 反而会在 hw_params 阶段失败（-22 Invalid argument）。所以这里
# 直接钉 hw，格式转换交给上层 GStreamer pipeline 自己做（audioconvert/audioresample
# + 显式 capsfilter 钉 S16LE/48000Hz/2ch，这是本机 codec 唯一验证过能工作的格式）。
pcm.!default {
    type hw
    card 1
    device 0
}

ctl.!default {
    type hw
    card 1
}