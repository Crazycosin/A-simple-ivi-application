; AndroidAuto 运行时配置
; 加载顺序（相对可执行文件所在目录）：
;   1. <exe目录>/androidauto.ini
;   2. <exe目录>/../config/androidauto.ini
;   3. ./androidauto.ini
; 颜色格式: 0xRRGGBBAA
; 资源相对路径基于本 ini 文件所在目录解析

[app]
; ivi surface id（application layer 段 3000-3999，勿与 3002 冲突）
surface_id = 3010
; 日志文件（空 = stderr）。放 /data 持久化，reboot 不丢（排障用）
log_path = /data/AndroidAuto/androidauto.log

[window]
; 标题栏文字
title = AndroidAuto
; 首帧默认尺寸（application layer = 屏高 - panel 高；configure 事件到达后自适应）
default_width = 1920
default_height = 1000
; 标题 logo（PNG，缺失则跳过；相对路径基于本 ini 目录）
logo_path = ../res/icons/androidauto.png

[player]
; 媒体架构：音视频共用一条固定系统时钟的管线（screencast-avsync-design），
; 输入统一为媒体包接口；文件源由 FilePacketFeeder（filesrc+parsebin）拆包。
; 是否启用播放（0 = 只显示占位窗口）
enabled = 1
; 视频源文件（兼作音频源，除非 audio_uri 单独指定）
video_uri = /data/gstreamer_test/resource/h265_aac_1920x960_60fps.mp4
; 独立音频源（空 = 跟 video_uri；须为 AAC 流——音频链固定 aacparse+avdec_aac）
audio_uri =
; EOS 后循环（feeder 按轮次累加 PTS 偏移，时间线单调）
loop = 0
; 传输 profile：usb=queue 100ms/卡顿 60ms；wifi=queue 500ms/卡顿 300ms
; （投屏链路用；文件源不敏感）
transport = usb
; queue 深度覆盖（ms，0 = 用 profile 值）
queue_max_ms = 0
; 卡顿阈值覆盖（ms，0 = 用 profile 值）
stall_threshold_ms = 0
; 卡顿检测 + IDR 恢复（投屏网络卡顿用；需发送端 IDR 请求通道配合）。
; 文件源必须保持 0：解码器启动追帧期 queue 顶满会误触发，
; 丢包+base_ts 重置会打乱音画时间线（实测循环卡死）。
stall_detect = 0
; 音频会话总开关（0 = 纯视频；weston 用户无 audio 组权限时的调试/
; 无音频投屏场景用；正式音频需设备侧把 weston 用户加 audio 组）
audio_enable = 1
; drm = 视频经空闲 overlay plane 直扫（omx use-dmabuf 零拷贝）；
; shm = 原 wl_shm+cairo 路径（保底回退，DrmView 创建失败也自动回退）
; render_path = shm
render_path = drm
; DRM 设备节点
drm_device = /dev/dri/card0
; 0 = 自动挑选空闲 plane（跳过 weston 占用层）；非零 = 强制指定（排障）
drm_plane_id = 0
; 视频目标矩形（屏幕绝对坐标，需与实际显示位置校准）
drm_viewport = 0,0,1920,650
; VPU dmabuf 布局 modifier。2026-09-18 查 BSP 源码（sysroot
; usr/src/debug/libomxvpu/1.0/src/omx_vpudec_component.c:990 与
; gstreamer1.0-omx/.../gstomxvideodec.c:1728-1730）证实：WAVE 核心
; wtlEnable 默认恒为 TRUE（硬件 Write-To-Linear，非 CPU 转换），只有
; caps 显式带 GST_CAPS_FEATURE_MEMORY_IFBC 时解码器才切 IFBC32x8Tiled
; 输出；appsink 协商的是纯 `video/x-raw(memory:DMABuf)`（无该 feature），
; 故 use-dmabuf=true 输出的就是 WTL 后的真 LINEAR NV12——之前按
; WAVE_32X8_TILE(22)/WAVE_32X8_FBDC(31) 注入 modifier 是错误猜测：
; `modetest -M semidrive -p` 实测 plane 43 的 NV12 IN_FORMATS 里根本
; 不含这两个值（每帧 AddFB2WithModifiers 必然 EINVAL，回退路径虽侥幸
; 因数据本就是 LINEAR 而"能看"，但退回前的拒绝噪音掩盖了真实状态，
; 且不能排除其他画面不纯净成因）。改回 0 = LINEAR，与实测数据布局和
; plane 实际支持的 modifier 列表一致。
drm_modifier = 0
; evdev 鼠标坐标累积边界（屏幕分辨率）
evdev_screen_w = 1920
evdev_screen_h = 720
; 启动时把 application layer 布局切 full_screen（占领 launcher 栏上方全部区域）。
; 注意：当前设备定制版 hmi-controller 的协议绑定有权限校验（仅允许
; weston-ivi-shell-user-interface），普通客户端绑定即 fatal 协议错误；
; 未解决该权限前必须保持 0（应用按 tiling 分格自适应）。
; 可行路径（需 compositor/BSP 侧配合，见 README「布局控制路径」章节）
fullscreen_layout = 0
; 退出时恢复 tiling 布局
restore_layout = 1
; 逐帧端到端时延统计（[latency] 日志行 + 退出总结）
latency_trace = 1
; 每隔多少帧打印一行 [latency]（0 = 只打退出总结）
latency_interval = 60
; 音画纠偏周期（秒，0 = 关；仅音视频两路并存时生效）
drift_interval_sec = 2

[ui]
; --- 度量 (px) ---
title_bar_height = 120
close_button_size = 96
close_button_margin = 12
; 播放区相对应用窗口上下左右边距
video_margin = 20
video_border_width = 4
video_border_radius = 12
; 播放窗口宽高比（0/0 = 跟随视频实际宽高比）
video_aspect_w = 0
video_aspect_h = 0
font_size = 28
; --- 配色 0xRRGGBBAA ---
color_background = 0xFF1A1D26
color_title_bar = 0xFF10141C
color_border = 0xFF2D8CFF
color_video_fill = 0xFF0A0E14
color_close_glyph = 0xFFE8E8E8
color_text = 0xFF9AA4B2
; --- 文案（无视频帧时的占位） ---
placeholder_text = Video Window (no content)
